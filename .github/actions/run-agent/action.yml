# The factory's single swappable agent definition (factory SPEC D6, story 44).
# Every task invokes the harness through here, so changing the model, CLI, or
# auth is a one-file change. v1 harness: the Claude Code CLI run headless
# (`claude -p`), authenticated with a personal Anthropic API key. Using the CLI
# directly (not anthropics/claude-code-action) means no GitHub App is required —
# we only need the agent to run read-only and return text; the workflow posts
# the comment itself.
name: run-agent
description: Run the factory's agent harness (claude -p) with a prompt and return its final text.

inputs:
  prompt:
    description: The task prompt for the agent (trusted; never interpolate untrusted issue text here).
    required: true
  # Supply this from a repository SECRET — the workflow does:
  #   api-key: ${{ secrets.ANTHROPIC_API_KEY }}
  # Composite-action inputs can't be declared `secret:` (only reusable workflows can),
  # but GitHub masks the registered secret value in logs wherever it appears, and this
  # action never echoes it — so it is handled as a secret in practice.
  api-key:
    description: Personal Anthropic API key. MUST come from a repo secret; GitHub masks it in logs.
    required: true
  model:
    description: Model id to pin. Explore defaults to Sonnet (frequent, read-only); implement/review may override to Opus.
    required: false
    default: claude-sonnet-4-6
  allowed-tools:
    description: Space-separated tools the agent may use.
    required: false
    default: Read Grep Glob
  disallowed-tools:
    description: Space-separated tools the agent must never use.
    required: false
    default: Bash Edit Write WebFetch WebSearch NotebookEdit
  permission-mode:
    description: Claude Code permission mode. `plan` enforces read-only.
    required: false
    default: plan

outputs:
  response:
    description: The agent's final text response.
    value: ${{ steps.agent.outputs.response }}

runs:
  using: composite
  steps:
    - name: Install the Claude Code CLI
      shell: bash
      run: npm install -g @anthropic-ai/claude-code@2.1.191

    - id: agent
      shell: bash
      env:
        # Auth: the CLI reads ANTHROPIC_API_KEY from the environment. Supplied from
        # a repo secret (masked in logs) and never echoed. Passing config via env
        # too, so untrusted values could never be shell-interpolated.
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        AGENT_PROMPT: ${{ inputs.prompt }}
        AGENT_MODEL: ${{ inputs.model }}
        AGENT_ALLOWED: ${{ inputs.allowed-tools }}
        AGENT_DISALLOWED: ${{ inputs.disallowed-tools }}
        AGENT_PERM: ${{ inputs.permission-mode }}
      run: |
        set -euo pipefail
        # Headless, read-only run; capture the final text for the caller to post.
        response="$(claude -p "$AGENT_PROMPT" \
          --model "$AGENT_MODEL" \
          --permission-mode "$AGENT_PERM" \
          --allowedTools "$AGENT_ALLOWED" \
          --disallowedTools "$AGENT_DISALLOWED" \
          --output-format text)"
        {
          echo "response<<__RUNAGENT_EOF__"
          printf '%s\n' "$response"
          echo "__RUNAGENT_EOF__"
        } >> "$GITHUB_OUTPUT"
