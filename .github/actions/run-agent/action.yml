# The factory's single swappable agent definition (factory SPEC D6, story 44).
# Every task invokes the harness through here, so changing the model, CLI, or
# auth is a one-file change. v1 harness: the Claude Code CLI run headless
# (`claude -p`), authenticated via GitHub OIDC -> Anthropic Workload Identity
# Federation. No long-lived credential is stored anywhere: GitHub mints a
# short-lived OIDC token per run, and the CLI exchanges it for a short-lived
# Claude token scoped to this repo. The workflow must grant `id-token: write`.
name: run-agent
description: Run the factory's agent harness (claude -p) with a prompt and return its final text.

inputs:
  prompt:
    description: The task prompt for the agent (trusted; never interpolate untrusted issue text here).
    required: true
  # Federation identifiers (NOT credentials): useless without a valid GitHub OIDC
  # token from this repo. Passed from repo secrets only to keep the Anthropic org
  # out of the public repo, not because possessing them grants access.
  federation-rule-id:
    description: Anthropic WIF federation rule id (fdrl_...).
    required: true
  organization-id:
    description: Anthropic organization id (UUID).
    required: true
  model:
    description: Model id to pin. Explore defaults to Sonnet (frequent, read-only).
    required: false
    default: claude-sonnet-4-6
  allowed-tools:
    description: Space-separated tools the agent may use.
    required: false
    default: Read Grep Glob
  disallowed-tools:
    description: Space-separated tools the agent must never use.
    required: false
    default: Bash Edit Write WebFetch WebSearch NotebookEdit
  permission-mode:
    description: Claude Code permission mode. `plan` enforces read-only.
    required: false
    default: plan

outputs:
  response:
    description: The agent's final text response.
    value: ${{ steps.agent.outputs.response }}

runs:
  using: composite
  steps:
    - name: Install the Claude Code CLI
      shell: bash
      run: npm install -g @anthropic-ai/claude-code@2.1.191

    - name: Mint a GitHub OIDC token for Anthropic
      shell: bash
      env:
        OIDC_AUDIENCE: https://api.anthropic.com
      run: |
        set -euo pipefail
        # Requires the job's `id-token: write` permission; the runner then provides
        # the request token/url env vars used below.
        tokfile="$(mktemp)"
        curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
          | jq -r '.value' > "$tokfile"
        [ -s "$tokfile" ] || { echo "::error::failed to mint GitHub OIDC token"; exit 1; }
        echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$tokfile" >> "$GITHUB_ENV"

    - id: agent
      shell: bash
      env:
        # With these set and no ANTHROPIC_API_KEY/ANTHROPIC_AUTH_TOKEN, the CLI
        # exchanges the OIDC token (ANTHROPIC_IDENTITY_TOKEN_FILE, exported above)
        # for a short-lived Claude token and refreshes it as needed.
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation-rule-id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization-id }}
        AGENT_PROMPT: ${{ inputs.prompt }}
        AGENT_MODEL: ${{ inputs.model }}
        AGENT_ALLOWED: ${{ inputs.allowed-tools }}
        AGENT_DISALLOWED: ${{ inputs.disallowed-tools }}
        AGENT_PERM: ${{ inputs.permission-mode }}
      run: |
        set -euo pipefail
        # Precedence foot-gun: a static credential (even empty) shadows federation.
        unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN || true
        response="$(claude -p "$AGENT_PROMPT" \
          --model "$AGENT_MODEL" \
          --permission-mode "$AGENT_PERM" \
          --allowedTools "$AGENT_ALLOWED" \
          --disallowedTools "$AGENT_DISALLOWED" \
          --output-format text)"
        {
          echo "response<<__RUNAGENT_EOF__"
          printf '%s\n' "$response"
          echo "__RUNAGENT_EOF__"
        } >> "$GITHUB_OUTPUT"
