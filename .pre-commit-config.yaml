# The factory's first brake: deterministic + security checks.
# The agent commits through these and must never use --no-verify, and must never
# edit this file or .github/ workflows (see docs/factory/SPEC.md stories 14-15).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: ^src/

  # Local hooks run in the project's uv environment so they see real dependencies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (+coverage)
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: pip-audit
        name: pip-audit (dependency CVEs)
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        always_run: true
