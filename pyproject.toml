[project]
name = "software-factory-example-python"
version = "0.0.0"
description = "Mock incident.io webhook -> permission-grant app, built by a software factory."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
]

# Resolve dependencies from public PyPI for this repo, overriding any global
# pip/uv index config (e.g. a corporate CodeArtifact proxy). This is a public,
# synthetic-data repo with only public OSS deps; integrity is still enforced by
# the hash-pinned uv.lock, so this changes the source, not the verification.
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grants"]

# --- Brakes configuration (see docs/factory/SPEC.md D5) ---

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=grants --cov-report=term-missing"

[tool.coverage.report]
show_missing = true
# fail_under is intentionally unset while the app is a scaffold. Raise it as a
# ratchet item (never a pre-broken check) once the factory builds real app code.
